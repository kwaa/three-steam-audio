name: cf-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Nix
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main

      # Node.js
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - id: steam_audio
        run: |
          revision=$(git -C steam-audio rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "STEAM_AUDIO_REV=$revision" >> "$GITHUB_ENV"

      # Steam Audio dependency dist
      - uses: actions/cache@v5
        with:
          path: |
            steam-audio/core/deps
          key: steam-audio-deps-${{ runner.os }}-${{ steps.steam_audio.outputs.revision }}-${{ hashFiles('flake.nix', 'flake.lock') }}

      # Build
      - run: nix develop --command just build-bindings
      - run: pnpm build

      # Deploy
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy docs/dist --project-name=three-steam-audio
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
